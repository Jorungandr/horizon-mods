id = "chattimestamps"
kind = "native-mod"
name = "Chat Timestamps"
summary = "Configurable chat timestamps: format, colour and hover detail."
description = """Stamps every chat message with a configurable time and date, in the colour you pick.

An unofficial Rust port of [Plague's Chat Timestamps](https://github.com/PlagueTR/ChatTimestamps) by PlagueTR (MIT), rebuilt on Horizon's native mod API. The original's copyright and MIT licence are kept in the package and in [`native/chattimestamps`](https://github.com/Jorungandr/horizon-rust-mods/tree/main/native/chattimestamps).

- Full `SimpleDateFormat`-style pattern strings, with three presets out of the box.
- Optional hover text with the full date, as in the original.
- Colour is configurable; the settings page uses Horizon's native settings UI instead of the original's Cloth Config.

It is the fuller sibling of **WhenChat**: pick this one when you want formats, colours and hover, or WhenChat for a plain fixed stamp."""
authors = ["PlagueTR", "Jorungandr"]
owners = ["Jorungandr"]
owner_ids = [188995885]
license = "MIT"
source = "https://github.com/Jorungandr/horizon-rust-mods/tree/main/native/chattimestamps"
icon = "icons/chattimestamps.png"
categories = ["social", "utility"]
tags = ["chat", "timestamp", "port", "configurable"]

