id = "whenchat"
kind = "native-mod"
name = "WhenChat"
summary = "Prefixes an [HH:MM:SS] local-time stamp on every chat message."
description = """Adds a local-time `[HH:MM:SS]` stamp to the front of every incoming chat line, so you can tell when something was said.

This is an unofficial Rust port of [WhenChat](https://github.com/ErikEdits/WhenChat) by ErikEdits (MIT), written against Horizon's native mod API. The original's credit and MIT licence are kept in the package and in [`native/whenchat`](https://github.com/Jorungandr/horizon-rust-mods/tree/main/native/whenchat).

- The stamp follows your computer's clock; the original's chat prefix behaviour is ported.
- Nothing is sent anywhere; it only changes how chat is drawn.
- Settings: enable/disable and whether to stamp your own messages."""
authors = ["ErikEdits", "Jorungandr"]
owners = ["Jorungandr"]
owner_ids = [188995885]
license = "MIT"
source = "https://github.com/Jorungandr/horizon-rust-mods/tree/main/native/whenchat"
icon = "icons/whenchat.png"
categories = ["social", "utility"]
tags = ["chat", "timestamp", "port", "whenchat"]

